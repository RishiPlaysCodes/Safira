<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRide Guardian - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0e21; --card: #1e2340; --blue: #4fc3f7; --cyan: #00e5ff; --text: #f5f5f5; --muted: #b0bec5; --border: rgba(255,255,255,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: rgba(30,35,64,0.8); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 28px; padding: 40px; width: 100%; max-width: 420px; }
        .auth-card h1 { font-size: 1.8rem; font-weight: 800; text-align: center; background: linear-gradient(90deg, var(--blue), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .auth-card .subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 30px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
        .form-group input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 0.95rem; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: var(--blue); }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--blue), var(--cyan)); color: var(--bg); border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(79,195,247,0.3); }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
        .auth-footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
        .error-msg { background: rgba(255,23,68,0.1); border: 1px solid rgba(255,23,68,0.3); color: #ff6b6b; padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to your SafeRide Guardian account</p>

        {% if form.errors %}
        <div class="error-msg">Invalid username or password. Please try again.</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
    </div>
</body>
</html>
