<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRide Guardian - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0e21; --card: #1e2340; --blue: #4fc3f7; --cyan: #00e5ff; --purple: #7c4dff; --text: #f5f5f5; --muted: #b0bec5; --border: rgba(255,255,255,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: rgba(30,35,64,0.8); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 28px; padding: 36px; width: 100%; max-width: 460px; }
        .auth-card h1 { font-size: 1.8rem; font-weight: 800; text-align: center; background: linear-gradient(90deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .auth-card .subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 0.9rem; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--blue); }
        .form-group select { appearance: none; }
        .form-group select option { background: var(--card); color: var(--text); }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--blue), var(--purple)); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124,77,255,0.3); }
        .auth-footer { text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--muted); }
        .auth-footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
        .error-msg { background: rgba(255,23,68,0.1); border: 1px solid rgba(255,23,68,0.3); color: #ff6b6b; padding: 10px; border-radius: 10px; font-size: 0.8rem; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Join SafeRide</h1>
        <p class="subtitle">Create your road safety guardian account</p>

        {% if form.errors %}
        <div class="error-msg">
            {% for field, errors in form.errors.items %}
                {% for error in errors %}{{ error }}<br>{% endfor %}
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create password" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone_number" placeholder="+91...">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Vehicle Type</label>
                    <select name="vehicle_type">
                        <option value="bike">Bike</option>
                        <option value="scooter">Scooter</option>
                        <option value="car">Car</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select name="role">
                        <option value="driver">Driver</option>
                        <option value="parent">Parent</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>License Number (optional)</label>
                <input type="text" name="license_number" placeholder="DL-XXXXXXXXX">
            </div>
            <button type="submit" class="btn-submit">Create Account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</body>
</html>
