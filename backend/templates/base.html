<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SafeRide Guardian{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #080c12;
            --surface: #0d1520;
            --surface2: #111d2e;
            --border: #1e3048;
            --accent: #00d4ff;
            --accent2: #0099cc;
            --danger: #ff3b3b;
            --warning: #ffaa00;
            --success: #00e676;
            --text: #e8f0fe;
            --text-muted: #5a7a99;
            --text-dim: #8ba8c4;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(0,212,255,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(0,153,204,0.04) 0%, transparent 50%);
        }

        /* NAV */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 64px;
            background: rgba(13,21,32,0.95);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-logo::before {
            content: '◈';
            font-size: 18px;
        }

        .nav-links {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 6px;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .nav-links a:hover {
            color: var(--accent);
            background: rgba(0,212,255,0.07);
        }

        .nav-links a.danger {
            color: var(--danger);
        }

        .nav-links a.danger:hover {
            background: rgba(255,59,59,0.1);
        }

        /* MAIN CONTENT */
        .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* CARDS */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 20px;
        }

        .card-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::before {
            content: '';
            display: block;
            width: 3px;
            height: 16px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* STAT GRID */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-family: 'Rajdhani', sans-serif;
            font-size: 38px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: var(--accent);
            color: #080c12;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #33ddff;
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0,212,255,0.3);
        }

        .btn-secondary {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-danger {
            background: rgba(255,59,59,0.12);
            color: var(--danger);
            border: 1px solid rgba(255,59,59,0.3);
        }

        .btn-danger:hover {
            background: rgba(255,59,59,0.2);
        }

        .btn-warning {
            background: var(--warning);
            color: #080c12;
            font-weight: 700;
        }

        .btn-warning:hover {
            background: #ffbb33;
            transform: translateY(-1px);
        }

        /* FORM STYLES */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
        }

        .form-input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
        }

        .form-group select option {
            background: var(--surface2);
        }

        /* PAGE HEADER */
        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        .page-subtitle {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: 15px;
        }

        /* BADGE */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-safe { background: rgba(0,230,118,0.12); color: var(--success); border: 1px solid rgba(0,230,118,0.2); }
        .badge-good { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); }
        .badge-warn { background: rgba(255,170,0,0.1); color: var(--warning); border: 1px solid rgba(255,170,0,0.2); }
        .badge-risky { background: rgba(255,59,59,0.1); color: var(--danger); border: 1px solid rgba(255,59,59,0.2); }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px;
            font-size: 14px;
            border-bottom: 1px solid rgba(30,48,72,0.5);
            color: var(--text-dim);
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(0,212,255,0.02); }

        /* STATUS PILL */
        .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .pill-ok { background: rgba(0,230,118,0.1); color: var(--success); }
        .pill-alert { background: rgba(255,59,59,0.1); color: var(--danger); }
        .pill-warn { background: rgba(255,170,0,0.1); color: var(--warning); }

        /* DIVIDER */
        hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

        /* QUICK ACTIONS GRID */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
        }

        .action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0,212,255,0.04);
            transform: translateY(-2px);
        }

        .action-btn.red:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,59,59,0.04); }
        .action-btn.red .action-icon { color: var(--danger); }

        .action-icon {
            font-size: 26px;
        }

        /* ALERT BANNER */
        .alert-banner {
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-banner.error { background: rgba(255,59,59,0.08); border: 1px solid rgba(255,59,59,0.2); color: #ff7070; }
        .alert-banner.success { background: rgba(0,230,118,0.08); border: 1px solid rgba(0,230,118,0.2); color: var(--success); }

        /* SCORE BAR */
        .score-bar-wrap {
            background: var(--surface2);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin-top: 10px;
        }

        .score-bar {
            height: 100%;
            border-radius: 6px;
            transition: width 1s ease;
        }

        /* EMPTY STATE */
        .empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty p { font-size: 15px; }

        /* PROFILE INFO */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(30,48,72,0.5);
        }

        .info-row:last-child { border-bottom: none; }
        .info-key { font-size: 13px; color: var(--text-muted); }
        .info-val { font-size: 14px; color: var(--text); font-weight: 500; }

        /* COUNTDOWN */
        .countdown-ring {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 30px auto;
        }

        .countdown-number {
            font-family: 'Rajdhani', sans-serif;
            font-size: 72px;
            font-weight: 700;
            color: var(--danger);
            text-align: center;
            line-height: 160px;
            position: absolute;
            width: 100%;
        }

        svg.ring {
            transform: rotate(-90deg);
            position: absolute;
        }

        .ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
        .ring-fg { fill: none; stroke: var(--danger); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { animation: fadeIn 0.4s ease both; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,59,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,59,59,0); }
        }

        .pulse { animation: pulse 1.5s infinite; }

        /* MESSAGES */
        .messages { list-style: none; margin-bottom: 16px; }
        .messages li { padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
        .messages .error { background: rgba(255,59,59,0.08); border: 1px solid rgba(255,59,59,0.2); color: #ff7070; }
        .messages .success { background: rgba(0,230,118,0.08); border: 1px solid rgba(0,230,118,0.2); color: var(--success); }
    </style>
</head>
<body>

{% if request.user.is_authenticated %}
<nav>
    <a href="/dashboard/" class="nav-logo">SafeRide Guardian</a>
    <div class="nav-links">
        <a href="/dashboard/">Dashboard</a>
        <a href="/trips/create/">New Trip</a>
        <a href="/trips/history/">History</a>
        <a href="/alerts/contact/">Emergency</a>
        <a href="/alerts/history/">Alerts</a>
        <a href="/logout/" class="danger">Logout</a>
    </div>
</nav>
{% endif %}

<div class="main">
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
