name: saferide_mobile
description: Real mobile starter for SafeRide Guardian - GPS speed, sensor accident suspicion, emergency call/SMS intent.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2
  sensors_plus: ^6.1.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

