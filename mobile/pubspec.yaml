name: saferide_mobile
description: SafeRide Guardian - AI-powered road safety with accident detection, live location sharing, helmet detection, and guardian alerts.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # GPS & Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  # Sensors (accelerometer for accident detection)
  sensors_plus: ^6.1.1
  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  # Networking
  http: ^1.2.2
  url_launcher: ^6.3.1
  # Local storage
  shared_preferences: ^2.3.2
  # Push notifications
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^19.4.2
  # Camera for helmet/traffic detection
  camera: ^0.11.0+2
  # AI/ML inference
  tflite_flutter: ^0.11.0
  # Image processing
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
